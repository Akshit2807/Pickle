version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  lottie: ^3.3.2
  cupertino_icons: ^1.0.8
  image_picker: ^1.0.4
  camera: ^0.10.5+5
  permission_handler: ^11.0.1
